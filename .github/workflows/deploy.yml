# The only way scorecardgtm.com gets deployed: a push to main (i.e. merging dev → main).
name: Deploy
on:
  push:
    branches: [main]

concurrency: { group: deploy, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # secrets live here; environment only allows main
    defaults: { run: { working-directory: site } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: site/.node-version, cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
      - run: npm run deploy
        env:
          CI_DEPLOY: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
