    <filter id="shadow" x="-20%" y="-40%" width="160%" height="200%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#03153A" flood-opacity=".13"/></filter>
    <style>text{font-family:Inter,Arial,sans-serif}.eyebrow{font-size:17px;font-weight:750;letter-spacing:3px}.title{font-size:62px;font-weight:760;letter-spacing:-2.7px}.label{font-size:31px;font-weight:700;letter-spacing:-.8px}.num{font-size:58px;font-weight:800}.micro{font-size:14px;font-weight:750;letter-spacing:2px}</style>
