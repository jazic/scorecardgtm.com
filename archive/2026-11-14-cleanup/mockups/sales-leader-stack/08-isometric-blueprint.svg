    <path d="M800 476L1290 630L800 784L310 630Z" fill="#649BE4" fill-opacity=".035" stroke="#649BE4" stroke-width="3"/>
    <path d="M800 652L1290 806L800 960L310 806Z" fill="#FCAF0F" fill-opacity=".03" stroke="#FCAF0F" stroke-width="3"/>
    <path d="M800 828L1290 982L800 1136L310 982Z" fill="#FFFFFF" fill-opacity=".02" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="3"/>
    <!-- connecting columns -->
    <path d="M310 278V982M1290 278V982M800 432V1136" stroke="#649BE4" stroke-opacity=".2" stroke-width="2" stroke-dasharray="5 10"/>
