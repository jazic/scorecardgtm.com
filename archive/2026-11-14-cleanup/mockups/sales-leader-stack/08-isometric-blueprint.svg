<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="72%"><stop stop-color="#12346B"/><stop offset="1" stop-color="#03153A"/></radialGradient>
    <pattern id="minor" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#649BE4" stroke-opacity=".055"/></pattern>
    <pattern id="major" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#649BE4" stroke-opacity=".12" stroke-width="1.5"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/><rect width="1600" height="1200" fill="url(#minor)"/><rect width="1600" height="1200" fill="url(#major)"/>
  <g fill="none" stroke-linejoin="round">
    <!-- vertical datum -->
    <path d="M800 116V1084" stroke="#A8D862" stroke-opacity=".7" stroke-width="2" stroke-dasharray="8 12" filter="url(#glow)"/>
