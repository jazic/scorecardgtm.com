  <g transform="translate(130 1060)" opacity=".68" fill="#649BE4"><rect width="14" height="14"/><rect x="18" width="14" height="14"/><rect y="18" width="14" height="14"/><rect x="18" y="18" width="14" height="14"/></g>
</svg>
