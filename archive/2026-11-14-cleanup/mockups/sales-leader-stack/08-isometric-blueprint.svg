    <g stroke="#FFFFFF" stroke-opacity=".35" stroke-width="2">
      <path d="M770 278H830M800 248V308"/><circle cx="800" cy="278" r="18"/>
      <path d="M770 454H830M800 424V484"/><circle cx="800" cy="454" r="18"/>
      <path d="M770 630H830M800 600V660"/><circle cx="800" cy="630" r="18"/>
      <path d="M770 806H830M800 776V836"/><circle cx="800" cy="806" r="18"/>
      <path d="M770 982H830M800 952V1012"/><circle cx="800" cy="982" r="18"/>
    </g>
    <!-- measured corner brackets -->
    <g stroke="#649BE4" stroke-opacity=".6" stroke-width="3">
      <path d="M288 262V294M294 250H326M1274 250H1306M1312 262V294"/>
      <path d="M288 966V998M294 1010H326M1274 1010H1306M1312 966V998"/>
    </g>
  </g>
  <g fill="#FFFFFF">
    <circle cx="800" cy="278" r="6" fill="#A8D862"/><circle cx="800" cy="454" r="6" fill="#B493EA"/><circle cx="800" cy="630" r="6" fill="#649BE4"/><circle cx="800" cy="806" r="6" fill="#FCAF0F"/><circle cx="800" cy="982" r="6"/>
