<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scorecard logo comparison</title>
  <style>
    body {
      margin: 0;
      background: #f7f9fc;
      color: #03153a;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      padding: 32px;
      display: grid;
      gap: 28px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .panel {
      background: white;
      border: 1px solid #dbe3ee;
      border-radius: 8px;
      padding: 18px;
      min-width: 0;
    }
    .label {
      margin-bottom: 14px;
      color: #526279;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .logo-wrap {
      display: grid;
      place-items: center start;
      overflow: hidden;
      min-height: 190px;
      border: 1px dashed #d6dfeb;
      border-radius: 6px;
      background:
        linear-gradient(90deg, rgba(3,21,58,.045) 1px, transparent 1px),
        linear-gradient(rgba(3,21,58,.045) 1px, transparent 1px),
        #fff;
      background-size: 24px 24px;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
    .large img {
      width: 100%;
      max-width: 1040px;
    }
    .nav .logo-wrap {
      min-height: 96px;
    }
    .nav img {
      width: auto;
      height: 36px;
    }
    .mark .logo-wrap {
      min-height: 230px;
    }
    .mark img {
      width: 46%;
      min-width: 420px;
    }
    @media (max-width: 900px) {
      .row { grid-template-columns: 1fr; }
      .mark img { width: 100%; min-width: 0; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Scorecard logo comparison</h1>

    <section class="row large">
      <div class="panel">
        <div class="label">Original PNG, trimmed art bounds</div>
        <div class="logo-wrap"><img src="file:///private/tmp/scorecard-logo-original-trim.png" alt="Original PNG trimmed"></div>
      </div>
      <div class="panel">
        <div class="label">V2 SVG</div>
        <div class="logo-wrap"><img src="file:///Users/justin/Documents/vscode/scorecardgtm.com/scorecard-logo-v2.svg" alt="V2 SVG"></div>
      </div>
      <div class="panel">
        <div class="label">V3 SVG</div>
        <div class="logo-wrap"><img src="file:///Users/justin/Documents/vscode/scorecardgtm.com/scorecard-logo-v3.svg?v=squares1" alt="V3 SVG"></div>
      </div>
    </section>

    <section class="row nav">
      <div class="panel">
        <div class="label">Original PNG at nav height</div>
        <div class="logo-wrap"><img src="file:///Users/justin/Documents/vscode/scorecardgtm.com/scorecard-logo.png" alt="Original PNG at nav size"></div>
      </div>
      <div class="panel">
        <div class="label">V2 SVG at nav height</div>
        <div class="logo-wrap"><img src="file:///Users/justin/Documents/vscode/scorecardgtm.com/scorecard-logo-v2.svg" alt="V2 SVG at nav size"></div>
      </div>
      <div class="panel">
        <div class="label">V3 SVG at nav height</div>
        <div class="logo-wrap"><img src="file:///Users/justin/Documents/vscode/scorecardgtm.com/scorecard-logo-v3.svg?v=squares1" alt="V3 SVG at nav size"></div>
      </div>
    </section>

    <section class="row mark">
      <div class="panel">
        <div class="label">Original PNG mark region</div>
        <div class="logo-wrap"><img src="file:///Users/justin/Documents/vscode/scorecardgtm.com/scorecard-logo.png" alt="Original PNG mark region"></div>
      </div>
      <div class="panel">
        <div class="label">V2 SVG mark region</div>
        <div class="logo-wrap"><img src="file:///Users/justin/Documents/vscode/scorecardgtm.com/scorecard-logo-v2.svg" alt="V2 SVG mark region"></div>
      </div>
      <div class="panel">
        <div class="label">V3 SVG mark region</div>
        <div class="logo-wrap"><img src="file:///Users/justin/Documents/vscode/scorecardgtm.com/scorecard-logo-v3.svg?v=squares1" alt="V3 SVG mark region"></div>
      </div>
    </section>
  </main>
</body>
</html>
